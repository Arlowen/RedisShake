openapi: 3.1.0
info:
  title: RedisShake Control Plane API
  version: 0.1.0
  description: API contract for the RedisShake Web control plane.
servers:
  - url: http://127.0.0.1:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Process liveness
      responses:
        "200":
          description: The control-plane process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadiness
      summary: Storage readiness
      responses:
        "200":
          description: The control plane and SQLite storage are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: SQLite storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/system/info:
    get:
      operationId: getSystemInfo
      summary: Control-plane build and storage information
      responses:
        "200":
          description: System information without credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
  /api/v1/connections:
    get:
      operationId: listConnections
      summary: List saved Redis connections
      responses:
        "200":
          description: Saved connections without credential material.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Connection"
    post:
      operationId: createConnection
      summary: Create a Redis connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionInput"
      responses:
        "201":
          description: Connection created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: A master key is required before storing credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/connections/{id}:
    parameters:
      - $ref: "#/components/parameters/ConnectionID"
    get:
      operationId: getConnection
      summary: Get a saved Redis connection
      responses:
        "200":
          description: Connection without credential material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateConnection
      summary: Update selected Redis connection fields
      description: Omitted credential fields are preserved. Send an empty credential value to clear it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionPatch"
      responses:
        "200":
          description: Updated connection without credential material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteConnection
      summary: Delete an unused Redis connection
      responses:
        "204":
          description: Connection deleted.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The connection is referenced by a task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/connections/test:
    post:
      operationId: testUnsavedConnection
      summary: Test connection settings without saving them
      description: A target test writes a random temporary Key with a 60-second TTL and then deletes it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connection, purpose]
              properties:
                connection:
                  $ref: "#/components/schemas/ConnectionInput"
                purpose:
                  $ref: "#/components/schemas/TestPurpose"
      responses:
        "200":
          description: Structured test result. Connection failures are represented by success=false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/connections/{id}/test:
    parameters:
      - $ref: "#/components/parameters/ConnectionID"
    post:
      operationId: testSavedConnection
      summary: Test a saved Redis connection
      description: A target test writes a random temporary Key with a 60-second TTL and then deletes it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose]
              properties:
                purpose:
                  $ref: "#/components/schemas/TestPurpose"
      responses:
        "200":
          description: Structured test result persisted as the connection's latest result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    ConnectionID:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid JSON or connection fields.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with existing data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Health:
      type: object
      required: [status, started_at]
      properties:
        status:
          const: ok
        started_at:
          type: string
          format: date-time
    Readiness:
      type: object
      required: [status, database]
      properties:
        status:
          const: ready
        database:
          const: ok
    SystemInfo:
      type: object
      required: [version, git_commit, storage, data_dir, runtime_dir, secrets_configured]
      properties:
        version:
          type: string
        git_commit:
          type: string
        storage:
          const: sqlite
        data_dir:
          type: string
        runtime_dir:
          type: string
        secrets_configured:
          type: boolean
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            field:
              type: string
    TLSInput:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
        server_name:
          type: string
        insecure_skip_verify:
          type: boolean
          default: false
        ca_cert_pem:
          type: string
          writeOnly: true
        client_cert_pem:
          type: string
          writeOnly: true
        client_key_pem:
          type: string
          writeOnly: true
    SentinelInput:
      type: object
      properties:
        address:
          type: string
          examples: ["127.0.0.1:26379"]
        master_name:
          type: string
        username:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
        tls:
          $ref: "#/components/schemas/TLSInput"
    ConnectionInput:
      type: object
      required: [name, topology]
      properties:
        name:
          type: string
          maxLength: 128
        topology:
          type: string
          enum: [standalone, sentinel, cluster]
        address:
          type: string
          description: Redis host:port. Optional for Sentinel because the master is resolved dynamically.
        username:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
        tls:
          $ref: "#/components/schemas/TLSInput"
        sentinel:
          $ref: "#/components/schemas/SentinelInput"
    TLSPatch:
      allOf:
        - $ref: "#/components/schemas/TLSInput"
      description: Only supplied properties are changed. Disabling TLS clears stored TLS material.
    SentinelPatch:
      allOf:
        - $ref: "#/components/schemas/SentinelInput"
      description: Only supplied properties are changed.
    ConnectionPatch:
      type: object
      properties:
        name:
          type: string
          maxLength: 128
        topology:
          type: string
          enum: [standalone, sentinel, cluster]
        address:
          type: string
        username:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
        tls:
          $ref: "#/components/schemas/TLSPatch"
        sentinel:
          $ref: "#/components/schemas/SentinelPatch"
    TLSView:
      type: object
      required: [enabled, insecure_skip_verify, ca_cert_configured, client_cert_configured, client_key_configured]
      properties:
        enabled:
          type: boolean
        server_name:
          type: string
        insecure_skip_verify:
          type: boolean
        ca_cert_configured:
          type: boolean
        client_cert_configured:
          type: boolean
        client_key_configured:
          type: boolean
    SentinelView:
      type: object
      required: [password_configured, tls]
      properties:
        address:
          type: string
        master_name:
          type: string
        username:
          type: string
        password_configured:
          type: boolean
        tls:
          $ref: "#/components/schemas/TLSView"
    Connection:
      type: object
      required: [id, name, topology, password_configured, tls, sentinel, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        topology:
          type: string
          enum: [standalone, sentinel, cluster]
        address:
          type: string
        username:
          type: string
        password_configured:
          type: boolean
        tls:
          $ref: "#/components/schemas/TLSView"
        sentinel:
          $ref: "#/components/schemas/SentinelView"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_tested_at:
          type: [string, "null"]
          format: date-time
        last_test_result:
          oneOf:
            - $ref: "#/components/schemas/ConnectionTestResult"
            - type: "null"
    TestPurpose:
      type: string
      enum: [source, target]
    CheckItem:
      type: object
      required: [code, state, message]
      properties:
        code:
          type: string
        state:
          type: string
          enum: [PASS, WARNING, FAIL]
        message:
          type: string
    ConnectionTestResult:
      type: object
      required: [success, purpose, cluster_enabled, latency_ms, checks, tested_at]
      properties:
        success:
          type: boolean
        purpose:
          $ref: "#/components/schemas/TestPurpose"
        effective_address:
          type: string
        server_product:
          type: string
        server_version:
          type: string
        role:
          type: string
        cluster_enabled:
          type: boolean
        latency_ms:
          type: integer
          format: int64
        checks:
          type: array
          items:
            $ref: "#/components/schemas/CheckItem"
        tested_at:
          type: string
          format: date-time
