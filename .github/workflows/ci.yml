name: CI

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]
    workflow_dispatch:

jobs:
    control-plane-quality:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            -   name: Git checkout
                uses: actions/checkout@v6

            -   name: Setup Golang with cache
                uses: actions/setup-go@v6
                with:
                    go-version-file: backend/go.mod
                    cache-dependency-path: backend/go.sum

            -   name: Setup Node with cache
                uses: actions/setup-node@v6
                with:
                    node-version: 24
                    cache: npm
                    cache-dependency-path: frontend/package-lock.json

            -   name: Install frontend dependencies
                run: npm ci
                working-directory: frontend

            -   name: Verify frontend
                run: |
                    npm run typecheck
                    npm run test
                    npm run build
                    npm audit --audit-level=high --registry=https://registry.npmjs.org
                working-directory: frontend

            -   name: Verify control plane
                run: |
                    go test -race ./internal/controlplane/... ./internal/client ./internal/config ./cmd/redis-shake-server
                    go vet ./...
                    go build -trimpath -o /tmp/redis-shake ./cmd/redis-shake
                    go build -trimpath -o /tmp/redis-shake-server ./cmd/redis-shake-server
                working-directory: backend

    web-e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 35
        steps:
            -   name: Git checkout
                uses: actions/checkout@v6

            -   name: Setup Node with cache
                uses: actions/setup-node@v6
                with:
                    node-version: 24
                    cache: npm
                    cache-dependency-path: frontend/package-lock.json

            -   name: Install frontend and Chromium
                run: |
                    npm ci
                    npx playwright install --with-deps chromium
                working-directory: frontend

            -   name: Start single-image demo environment
                run: docker compose -f deploy/compose.dev.yaml up -d --build --wait

            -   name: Run browser-to-Redis E2E
                run: npm run test:e2e
                working-directory: frontend

            -   name: Run ACL, Sentinel, Cluster, and TLS matrix
                run: sh deploy/matrix/verify.sh

            -   name: Upload Playwright report
                if: ${{ !cancelled() }}
                uses: actions/upload-artifact@v6
                with:
                    name: playwright-report
                    path: frontend/playwright-report/
                    retention-days: 14

            -   name: Capture container logs
                if: ${{ failure() }}
                run: docker compose -f deploy/compose.dev.yaml logs --no-color

            -   name: Stop demo environment
                if: ${{ always() }}
                run: docker compose -f deploy/compose.dev.yaml down --volumes --remove-orphans

    redis-test:
        runs-on: ubuntu-latest
        strategy:
            max-parallel: 10
            matrix:
                redis-version: [ "2.8", "3.0", "4.0", "5.0", "6.0", "7.0", "8.0" ]
            fail-fast: false
        steps:
            -   name: Git checkout
                uses: actions/checkout@v6

            -   name: Setup Golang with cache
                uses: actions/setup-go@v6
                with:
                    go-version-file: backend/go.mod
                    cache-dependency-path: backend/go.sum

            -   name: Cache Redis binary
                id: cache-redis
                uses: actions/cache@v5
                with:
                    path: redis/bin
                    key: redis-${{ matrix.redis-version }}-${{ runner.os }}-v1

            -   name: Build Redis
                if: steps.cache-redis.outputs.cache-hit != 'true'
                run: |
                    git clone --depth 1 --branch ${{ matrix.redis-version }} https://github.com/redis/redis
                    cd redis
                    make -j$(nproc)
                    mkdir -p bin
                    cp src/redis-server bin/

            -   name: Add Redis to PATH
                run: echo "$GITHUB_WORKSPACE/redis/bin" >> $GITHUB_PATH

            -   name: Setup Python with cache
                uses: actions/setup-python@v6
                with:
                    python-version: '3.11'
                    cache: 'pip'
                    cache-dependency-path: backend/tests/requirements.txt

            -   name: Install Python dependencies
                run: pip install -r tests/requirements.txt
                working-directory: backend

            -   name: Build redis-shake
                run: sh build.sh
                working-directory: backend

            -   name: Run tests
                run: PYBBT_FLAGS="" sh test.sh
                working-directory: backend

    redis-modules-test:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            TAIR_STRING_COMMIT: 2ffe26cf65f9c7e523ed7de831bdca5c561a6718
            TAIR_HASH_COMMIT: 9ee21d6989475963437138661b04d5ed62f4841d
            TAIR_ZSET_COMMIT: 4dc3a6559da1636c37df04f51fbef52b2ebca2f5
        steps:
            -   name: Git checkout
                uses: actions/checkout@v6

            -   name: Setup Golang with cache
                uses: actions/setup-go@v6
                with:
                    go-version-file: backend/go.mod
                    cache-dependency-path: backend/go.sum

            -   name: Cache Redis 7 binary
                id: cache-redis
                uses: actions/cache@v5
                with:
                    path: redis/bin
                    key: redis-7.0-${{ runner.os }}-v1

            -   name: Build Redis 7
                if: steps.cache-redis.outputs.cache-hit != 'true'
                run: |
                    git clone --depth 1 --branch 7.0 https://github.com/redis/redis
                    cd redis
                    make -j$(nproc)
                    mkdir -p bin
                    cp src/redis-server bin/

            -   name: Add Redis to PATH
                run: echo "$GITHUB_WORKSPACE/redis/bin" >> $GITHUB_PATH

            -   name: Cache pinned Tair modules
                id: cache-tair
                uses: actions/cache@v5
                with:
                    path: tair-modules
                    key: tair-modules-${{ runner.os }}-${{ env.TAIR_STRING_COMMIT }}-${{ env.TAIR_HASH_COMMIT }}-${{ env.TAIR_ZSET_COMMIT }}

            -   name: Build pinned Tair modules
                if: steps.cache-tair.outputs.cache-hit != 'true'
                run: |
                    mkdir -p tair-modules
                    git clone https://github.com/tair-opensource/TairString.git
                    git -C TairString checkout "$TAIR_STRING_COMMIT"
                    git clone https://github.com/tair-opensource/TairHash.git
                    git -C TairHash checkout "$TAIR_HASH_COMMIT"
                    git clone https://github.com/tair-opensource/TairZset.git
                    git -C TairZset checkout "$TAIR_ZSET_COMMIT"
                    for repo in TairString TairHash TairZset; do
                        mkdir "$repo/build"
                        cmake -S "$repo" -B "$repo/build"
                        cmake --build "$repo/build" --parallel "$(nproc)"
                        cp "$repo"/lib/*.so tair-modules/
                    done

            -   name: Install Tair modules
                run: sudo cp tair-modules/*.so /lib/

            -   name: Setup Python with cache
                uses: actions/setup-python@v6
                with:
                    python-version: '3.11'
                    cache: pip
                    cache-dependency-path: backend/tests/requirements.txt

            -   name: Install Python dependencies
                run: pip install -r tests/requirements.txt
                working-directory: backend

            -   name: Build and test module migration
                run: |
                    sh build.sh
                    PYBBT_FLAGS=modules sh test.sh
                working-directory: backend

    valkey-test:
        runs-on: ubuntu-latest
        strategy:
            max-parallel: 10
            matrix:
                valkey-version: [ "8.0", "9.0" ]
            fail-fast: false
        steps:
            -   name: Git checkout
                uses: actions/checkout@v6

            -   name: Setup Golang with cache
                uses: actions/setup-go@v6
                with:
                    go-version-file: backend/go.mod
                    cache-dependency-path: backend/go.sum

            -   name: Cache Valkey binary
                id: cache-valkey
                uses: actions/cache@v5
                with:
                    path: valkey/bin
                    key: valkey-${{ matrix.valkey-version }}-${{ runner.os }}-v1

            -   name: Build Valkey
                if: steps.cache-valkey.outputs.cache-hit != 'true'
                run: |
                    git clone --depth 1 --branch ${{ matrix.valkey-version }} https://github.com/valkey-io/valkey
                    cd valkey
                    make -j$(nproc)
                    mkdir -p bin
                    cp src/valkey-server bin/redis-server

            -   name: Add Valkey to PATH
                run: echo "$GITHUB_WORKSPACE/valkey/bin" >> $GITHUB_PATH

            -   name: Setup Python with cache
                uses: actions/setup-python@v6
                with:
                    python-version: '3.11'
                    cache: 'pip'
                    cache-dependency-path: backend/tests/requirements.txt

            -   name: Install Python dependencies
                run: pip install -r tests/requirements.txt
                working-directory: backend

            -   name: Build redis-shake
                run: sh build.sh
                working-directory: backend

            -   name: Run tests
                run: |
                    go test ./... -v
                    cd tests/ && export PYTHONPATH="$(pwd):$PYTHONPATH" && python -m pybbt cases --verbose
                working-directory: backend
